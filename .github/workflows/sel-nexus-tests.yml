# Added by SEL Nexus CyberSuite (Application Security): runs this repository's tests on the agents' fix
# branch. When a test fails, the suite's Remediation Agent fixes it and pushes again, which runs this workflow again.
name: SEL Nexus tests
on:
  push:
    branches: ['ai-remediation/e0de33a5-e4d08011']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sel-nexus-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all tests
        run: ./gradlew test
